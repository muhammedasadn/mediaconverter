<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Hazel</title>
<meta name="description" content="If Hazel has been useful to you, consider supporting its development. Your support helps me keep improving Hazel and building new features. Every bit of love means a lot. 💚">
<meta name="theme-color" content="#0a0c12">
<link rel="icon" href="Haze.svg">
<script>
/* Set the theme before first paint so there is no flash */
(function(){
  var t=null;
  try{t=localStorage.getItem("hazel-theme")}catch(e){}
  if(t!=="light"&&t!=="dark"){t="dark";}
  document.documentElement.setAttribute("data-theme",t);
})();
</script>
<style>
:root{color-scheme:dark;
 --fg:#f4f6fb;--mut:#97a0b5;--card:rgba(255,255,255,.06);--cardh:rgba(255,255,255,.1);--bd:rgba(255,255,255,.12);
 --sh:none;--shh:none;--chip:transparent;--hg:linear-gradient(#f4f6fb,#f4f6fb);
 --lb:linear-gradient(145deg,#1b2030,#0b0d14);--ls:0 0 0 1px rgba(255,255,255,.14),0 14px 50px rgba(236,72,153,.35);
 --bg:radial-gradient(600px 380px at 20% 10%,rgba(236,72,153,.28),transparent 70%),radial-gradient(560px 380px at 85% 85%,rgba(253,221,0,.16),transparent 70%),#0a0c12}
:root[data-theme="light"]{color-scheme:light;
 --fg:#1c1b2e;--mut:#6b6a85;--card:rgba(255,255,255,.8);--cardh:#fff;--bd:rgba(120,110,200,.14);
 --sh:0 12px 40px -12px rgba(110,90,220,.25);--shh:0 18px 50px -12px rgba(110,90,220,.4);--chip:rgba(255,255,255,.5);--hg:linear-gradient(90deg,#c026d3,#4f46e5);
 --lb:#1c1b2e;--ls:0 14px 36px -10px rgba(76,60,200,.45);
 --bg:radial-gradient(520px 340px at 10% 0,#ffd9ec,transparent 70%),radial-gradient(520px 360px at 95% 20%,#d9e4ff,transparent 70%),radial-gradient(500px 360px at 50% 100%,#fff2c2,transparent 70%),#fafaff}
*{box-sizing:border-box}
html{background:var(--bg);background-attachment:fixed}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 padding:calc(64px + env(safe-area-inset-top,0px)) 20px calc(48px + env(safe-area-inset-bottom,0px));
 color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:520px;display:grid;gap:26px;text-align:center;justify-items:center}
.logo{width:84px;height:84px;border-radius:24px;display:block;box-shadow:var(--ls)}
h1{font-size:clamp(32px,6vw,44px);line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance;background:var(--hg);-webkit-background-clip:text;background-clip:text;color:transparent}
.t{color:var(--mut);margin:14px auto 0;line-height:1.65;max-width:44ch;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips span{font-size:12px;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--mut);background:var(--chip)}
.opts{display:grid;gap:12px;width:100%}
.opt{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:22px;color:inherit;text-decoration:none;text-align:left;box-shadow:var(--sh);
 -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .2s,box-shadow .2s,background .2s}
.opt:hover,.opt:focus-visible{transform:translateY(-2px);background:var(--cardh);box-shadow:var(--shh);outline:none}
.opt:focus-visible{box-shadow:0 0 0 2px var(--fg)}
.ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
.gh .ic{background:#ea4aaa}
.bmc .ic{background:#ffdd00}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{color:var(--mut);font-size:14px}
.lbl{flex:1}
.chev{flex:none;margin-left:auto;color:var(--mut)}
.ft a{color:var(--mut);font-size:13px}
.tg{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--sh);transition:transform .25s}
.tg:hover{transform:rotate(18deg) scale(1.06)}
.tg:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg .moon{display:none}
:root[data-theme="light"] .tg .moon{display:block}
:root[data-theme="light"] .tg .sun{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button class="tg" id="tg" type="button" aria-label="Switch to light theme" title="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
</button>

<main class="w">
  <img class="logo" src="Haze.svg" alt="Hazel">

  <header>
    <h1>Media Converter</h1>
    <p class="t">Media Converter is free, open-source software under the GNU GPL v3.0, based on Hazel.</p>
    <div class="chips"><span>Open source</span><span>No ads</span><span>No analytics</span></div>
  </header>

  <div class="opts">
    <a class="opt gh" href="https://github.com/muhammedasadn/mediaconverter" rel="noopener">
      <span class="lbl"><b>GitHub Repository</b><small>Source code and releases</small></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>

  <footer class="ft"><a href="https://github.com/muhammedasadn/mediaconverter" rel="noopener">github.com/muhammedasadn/mediaconverter</a></footer>
</main>

<script>
(function(){
  var root=document.documentElement,btn=document.getElementById("tg"),meta=document.querySelector('meta[name="theme-color"]');
  function paint(){
    var light=root.getAttribute("data-theme")==="light";
    btn.setAttribute("aria-label",light?"Switch to dark theme":"Switch to light theme");
    if(meta)meta.setAttribute("content",light?"#fafaff":"#0a0c12");
  }
  btn.addEventListener("click",function(){
    var next=root.getAttribute("data-theme")==="light"?"dark":"light";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("hazel-theme",next)}catch(e){}
    paint();
  });
  paint();
})();
</script>
</body>
</html>
